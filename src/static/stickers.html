<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofia's Stickers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <style>
    .preview { height: 180px; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
    .preview img, .preview video { max-height: 170px; max-width: 100%; }
    .card { height: 100%; display: flex; flex-direction: column; }
    .card-content { flex-grow: 1; }
    textarea.description { font-size: 0.85rem; }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title">Sofia's Stickers & GIFs</h1>
      <p class="subtitle is-6">Sofia only uses <strong>approved</strong> stickers. Stickers she receives wait here as <strong>pending</strong>. Descriptions are what her search matches against, so keep them accurate.</p>

      <div class="box">
        <h2 class="title is-5">Upload</h2>
        <div class="columns">
          <div class="column is-4">
            <div class="field">
              <label class="label">File</label>
              <div class="file has-name is-fullwidth">
                <label class="file-label">
                  <input class="file-input" type="file" id="upload-file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/quicktime">
                  <span class="file-cta"><span class="file-label">Choose a file…</span></span>
                  <span class="file-name" id="upload-name">No file</span>
                </label>
              </div>
            </div>
            <div class="field">
              <label class="label">Send as</label>
              <div class="select is-fullwidth">
                <select id="upload-kind">
                  <option value="sticker">Sticker (png, jpg, webp, gif → 512×512 webp)</option>
                  <option value="gif">GIF (gif or video → mp4)</option>
                </select>
              </div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label">Description <span class="has-text-grey has-text-weight-normal">(optional, written automatically if empty)</span></label>
              <textarea class="textarea" id="upload-description" rows="4" placeholder="What it shows, any text on it, and when to send it"></textarea>
            </div>
            <button class="button is-primary" id="upload-button">Upload</button>
          </div>
        </div>
      </div>

      <div id="notification"></div>

      <div class="tabs is-boxed">
        <ul id="tabs">
          <li data-status="pending"><a>Pending <span class="tag is-warning is-rounded ml-2" id="pending-count">0</span></a></li>
          <li data-status="approved"><a>Approved</a></li>
          <li data-status="rejected"><a>Rejected</a></li>
          <li data-status=""><a>All</a></li>
        </ul>
      </div>

      <div class="columns is-multiline" id="stickers"></div>
      <p class="has-text-grey has-text-centered is-hidden" id="empty">Nothing here.</p>
    </div>
  </section>

  <template id="card-template">
    <div class="column is-12-mobile is-6-tablet is-4-desktop is-3-widescreen">
      <div class="card">
        <div class="card-image preview"></div>
        <div class="card-content p-3">
          <div class="tags mb-2"></div>
          <textarea class="textarea description" rows="6"></textarea>
        </div>
        <footer class="card-footer buttons are-small p-2 mb-0">
          <button class="button is-success" data-action="approve">Approve</button>
          <button class="button is-warning" data-action="reject">Reject</button>
          <button class="button is-info is-light" data-action="save">Save</button>
          <button class="button is-light" data-action="describe" title="Write the description again with the vision model">Re-describe</button>
          <button class="button is-danger is-light" data-action="delete">Delete</button>
        </footer>
      </div>
    </div>
  </template>

  <script>
    let status = 'pending';

    function notify(message, type = 'is-danger') {
      const el = document.getElementById('notification');
      el.innerHTML = '';
      const div = document.createElement('div');
      div.className = `notification ${type} is-light`;
      div.textContent = message;
      el.appendChild(div);
      setTimeout(() => div.remove(), 6000);
    }

    async function api(url, options = {}) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `${res.status} ${res.statusText}`);
      }
      return res.status == 204 ? null : res.json();
    }

    function tag(text, cls) {
      const span = document.createElement('span');
      span.className = `tag ${cls}`;
      span.textContent = text;
      return span;
    }

    function renderCard(s) {
      const node = document.getElementById('card-template').content.cloneNode(true);
      const preview = node.querySelector('.preview');
      const fileUrl = `/api/stickers/${s.id}/file`;
      if (s.mime.startsWith('video/')) {
        const video = Object.assign(document.createElement('video'), { src: fileUrl, autoplay: true, loop: true, muted: true, playsInline: true });
        preview.appendChild(video);
      }
      else {
        preview.appendChild(Object.assign(document.createElement('img'), { src: fileUrl, alt: s.description, loading: 'lazy' }));
      }
      const tags = node.querySelector('.tags');
      tags.append(
        tag(s.id, 'is-dark'),
        tag(s.kind == 'gif' ? 'GIF' : 'Sticker', 'is-link is-light'),
        ...(s.animated && s.kind == 'sticker' ? [tag('animated', 'is-info is-light')] : []),
        tag(s.status, { pending: 'is-warning', approved: 'is-success', rejected: 'is-danger' }[s.status] + ' is-light'),
        tag(s.source == 'received' ? `from ${(s.receivedFrom || 'unknown').split('@')[0]}` : 'uploaded', 'is-light'),
      );
      const description = node.querySelector('.description');
      description.value = s.description;
      node.querySelector('[data-action="approve"]').classList.toggle('is-hidden', s.status == 'approved');
      node.querySelector('[data-action="reject"]').classList.toggle('is-hidden', s.status == 'rejected');

      node.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', async () => {
        const action = button.dataset.action;
        if (action == 'delete' && !confirm(`Delete ${s.id}? This can't be undone.`)) return;
        button.classList.add('is-loading');
        try {
          if (action == 'approve' || action == 'reject') {
            await api(`/api/stickers/${s.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: action == 'approve' ? 'approved' : 'rejected', description: description.value }) });
          }
          else if (action == 'save') {
            await api(`/api/stickers/${s.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ description: description.value }) });
            notify(`Saved ${s.id}`, 'is-success');
          }
          else if (action == 'describe') {
            const updated = await api(`/api/stickers/${s.id}/describe`, { method: 'POST' });
            description.value = updated.description;
          }
          else if (action == 'delete') {
            await api(`/api/stickers/${s.id}`, { method: 'DELETE' });
          }
          if (action != 'save' && action != 'describe') await load();
        }
        catch (e) {
          notify(`${action} failed: ${e.message}`);
        }
        finally {
          button.classList.remove('is-loading');
        }
      }));
      return node;
    }

    async function load() {
      try {
        const [stickers, pending] = await Promise.all([
          api(`/api/stickers${status ? `?status=${status}` : ''}`),
          status == 'pending' ? null : api('/api/stickers?status=pending'),
        ]);
        document.getElementById('pending-count').textContent = (pending ?? stickers).length;
        const container = document.getElementById('stickers');
        container.replaceChildren(...stickers.map(renderCard));
        document.getElementById('empty').classList.toggle('is-hidden', stickers.length > 0);
      }
      catch (e) {
        notify(`Couldn't load stickers: ${e.message}`);
      }
    }

    document.querySelectorAll('#tabs li').forEach(li => li.addEventListener('click', () => {
      status = li.dataset.status;
      document.querySelectorAll('#tabs li').forEach(l => l.classList.toggle('is-active', l == li));
      load();
    }));

    const fileInput = document.getElementById('upload-file');
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      document.getElementById('upload-name').textContent = file ? file.name : 'No file';
      if (file && file.type.startsWith('video/')) document.getElementById('upload-kind').value = 'gif';
    });

    document.getElementById('upload-button').addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return notify('Choose a file first');
      const button = document.getElementById('upload-button');
      button.classList.add('is-loading');
      try {
        const params = new URLSearchParams({ kind: document.getElementById('upload-kind').value });
        const description = document.getElementById('upload-description').value.trim();
        if (description) params.set('description', description);
        const added = await api(`/api/stickers?${params}`, { method: 'POST', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });
        notify(added.duplicate ? `Already saved as ${added.id}` : `Uploaded ${added.id}`, added.duplicate ? 'is-warning' : 'is-success');
        fileInput.value = '';
        document.getElementById('upload-name').textContent = 'No file';
        document.getElementById('upload-description').value = '';
        status = added.status;
        document.querySelectorAll('#tabs li').forEach(l => l.classList.toggle('is-active', l.dataset.status == status));
        await load();
      }
      catch (e) {
        notify(`Upload failed: ${e.message}`);
      }
      finally {
        button.classList.remove('is-loading');
      }
    });

    document.querySelector('#tabs li[data-status="pending"]').classList.add('is-active');
    load();
  </script>
</body>
</html>
